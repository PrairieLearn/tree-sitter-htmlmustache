name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated parser
        run: |
          pnpm exec tree-sitter generate
          git diff --exit-code -- src
      - name: Test parser and Node binding
        run: pnpm test
      - name: Install Python binding
        run: python -m pip install -e ".[core]"
      - name: Test Python binding
        run: python -m unittest discover -v -s bindings/python/tests
